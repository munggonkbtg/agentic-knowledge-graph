[project]
name = "kg-pipeline"
version = "0.1.0"
description = "Research prototype: document knowledge graph and impact analysis for Markdown corpora (Thai and English)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=4.3",
    "neo4j>=6.4",
    "pydantic>=2.14",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.29",
]

[project.scripts]
kg = "kg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j database (skipped when NEO4J_* variables are not set)",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
]
