# Tunable values for the pipeline. Secrets (passwords, API keys) do NOT go here;
# they are read from environment variables (see .env.example).

neo4j:
  # Name of the database inside the Neo4j server. Community edition has one
  # user database, called "neo4j" by default.
  database: neo4j

layer0:
  # If a file has exactly one level-1 heading and it comes first, treat it as the
  # document title instead of part of every block's heading path. Titles change
  # between versions (e.g. T1 "(ฉบับ Update ล่าสุด)"), which would otherwise change
  # every block_id in the file.
  title_heading_in_path: false
  # Footnote markers such as [๑๖] are removed before hashing (kept on the block in
  # `footnotes`). They are renumbered between versions of the Thai laws.
  strip_footnote_markers: true
  footnote_marker_pattern: '\[[0-9๐-๙]+\]'
  # Convert Thai digits (๐-๙) to Arabic (0-9) in heading paths and before hashing.
  thai_digits_to_arabic: true
  # Blocks under these headings (normalized, any level) get role "footnote"
  # instead of "body", so later layers can skip them. The Thai laws end with a
  # เชิงอรรถ list of amendment history (74 of 320 blocks in the old T1).
  footnote_sections: ["เชิงอรรถ"]
  # A top-level list longer than this many characters becomes one block per
  # top-level item (kind "list_item"); shorter lists stay one block.
  # null = never split.
  split_list_over_chars: 1500

diff:
  # PROVISIONAL (open question): minimum text similarity (0-1, rapidfuzz ratio on
  # normalized text) for an old and a new block in the same section to count as
  # "edited" rather than "removed + added". To be set from the person's check.
  edit_similarity_threshold: 0.5
  # Pass 2b: an old and a new block in DIFFERENT sections of the same document
  # count as "edited" (moved within the document and edited) at or above this
  # similarity. Set to null to turn the pass off.
  cross_section_edit_threshold: 0.8
  # A section whose heading was renamed (e.g. "Your First 90 Days" -> "Your First
  # Year") is treated as the same section when most of its unchanged blocks went to
  # one new section.
  align_renamed_sections: true
  # Look for removed blocks among the added blocks of the *other* documents in the
  # same upload event (e.g. the severance paragraph moving from E3 to E2).
  detect_cross_document_moves: true
  # PROVISIONAL: minimum similarity for pass 3 (moved to another document). Kept
  # apart from edit_similarity_threshold because moved text is often rewritten:
  # the E3 -> E2 severance paragraphs score 0.44 and 0.49, but unrelated English
  # paragraphs already score 0.41-0.44, so lowering this alone adds false moves.
  # To be set from the blind labels.
  move_similarity_threshold: 0.5
  # Pass 3 also compares a removed block with up to this many consecutive added
  # blocks of another document joined together: a moved paragraph is often split
  # (E3 -> E2 severance: 0.40-0.49 per block, 0.76 joined). 1 = no splits.
  split_window: 3
  # Footnote entries (role "footnote", see layer0.footnote_sections) are matched
  # by identical text only: their text is a template ("มาตรา X แก้ไขเพิ่มเติมโดย
  # ... (ฉบับที่ Y)"), so similarity would pair unrelated entries.

identify:
  # Document identification for files without a doc_key (docs/plan.md, M3).
  # All values PROVISIONAL. On the pilot, the right document scored 0.75-0.96
  # text similarity and every other document <= 0.39.
  accept_text_similarity: 0.7   # best candidate at or above this ...
  accept_margin: 0.2            # ... and this far above the second -> accept
  new_document_below: 0.45      # best below this -> new document (to confirm)
  compare_chars: 20000          # characters of normalized text compared
  queue_file: data/labels/doc_identification_queue.csv

layer1:
  # Version of the extraction rules, stored on every REFERENCES edge. A rerun with
  # a new version closes edges of older versions (valid_to) instead of deleting them.
  # L1-v1: first rules. L1-v2: fixes after the dev labels (docs/plan.md).
  # L1-v3: L1-v2 made deterministic (subject targets did not depend on set order).
  rule_version: L1-v3
  # REFERENCES (docs/plan.md, M3). Confidence by how the target was found.
  # All values PROVISIONAL until measured against labels.
  confidence:
    explicit: 1.0          # law name right before/after the section ("มาตรา 6 แห่งพระราชบัญญัติ…")
    link: 1.0              # Markdown link to a known file
    self_document: 0.9     # bare มาตรา/ข้อ inside an act cites the act itself
    same_block_context: 0.85  # bare มาตรา after a law named earlier in the same block
    issued_under: 0.7      # bare มาตรา in a regulation -> the act it is issued under
    name_without_year: 0.8 # law named without พ.ศ. and only one known document fits
    title_mention: 0.7     # English: exact title of another handbook page in text
    subject_name: 0.7      # law named by subject only ("กฎหมายว่าด้วยการคุ้มครองแรงงาน")
  # Extra names for documents, reviewed by a person: {doc_key: [alias, ...]}.
  aliases_file: registry/aliases.yaml

# Later milestones will add sections here, for example:
#   layer2: entity types, NER threshold                            (M4)
#   hubs:   hub cut-off                                             (M4/M5)
#   llm:    model names, prompt_version                             (M3+)
#   impact: N (checker budget)                                      (M5)
