# Tunable values for the pipeline. Secrets (passwords, API keys) do NOT go here;
# they are read from environment variables (see .env.example).

neo4j:
  # Name of the database inside the Neo4j server. Community edition has one
  # user database, called "neo4j" by default.
  database: neo4j

layer0:
  # If a file has exactly one level-1 heading and it comes first, treat it as the
  # document title instead of part of every block's heading path. Titles change
  # between versions (e.g. T1 "(ฉบับ Update ล่าสุด)"), which would otherwise change
  # every block_id in the file.
  title_heading_in_path: false
  # Footnote markers such as [๑๖] are removed before hashing (kept on the block in
  # `footnotes`). They are renumbered between versions of the Thai laws.
  strip_footnote_markers: true
  footnote_marker_pattern: '\[[0-9๐-๙]+\]'
  # Convert Thai digits (๐-๙) to Arabic (0-9) in heading paths and before hashing.
  thai_digits_to_arabic: true
  # Blocks under these headings (normalized, any level) get role "footnote"
  # instead of "body", so later layers can skip them. The Thai laws end with a
  # เชิงอรรถ list of amendment history (74 of 320 blocks in the old T1).
  footnote_sections: ["เชิงอรรถ"]
  # A top-level list longer than this many characters becomes one block per
  # top-level item (kind "list_item"); shorter lists stay one block.
  # null = never split.
  split_list_over_chars: 1500

diff:
  # PROVISIONAL (open question): minimum text similarity (0-1, rapidfuzz ratio on
  # normalized text) for an old and a new block in the same section to count as
  # "edited" rather than "removed + added". To be set from a person's blind check.
  edit_similarity_threshold: 0.5
  # Pass 2b: an old and a new block in DIFFERENT sections of the same document
  # count as "edited" (moved within the document and edited) at or above this
  # similarity. Set to null to turn the pass off.
  cross_section_edit_threshold: 0.8
  # A section whose heading was renamed (e.g. "Your First 90 Days" -> "Your First
  # Year") is treated as the same section when most of its unchanged blocks went to
  # one new section.
  align_renamed_sections: true
  # Look for removed blocks among the added blocks of the *other* documents in the
  # same upload event (e.g. the severance paragraph moving from E3 to E2).
  detect_cross_document_moves: true
  # PROVISIONAL: minimum similarity for pass 3 (moved to another document). Kept
  # apart from edit_similarity_threshold because moved text is often rewritten:
  # the E3 -> E2 severance paragraphs score 0.44 and 0.49, but unrelated English
  # paragraphs already score 0.41-0.44, so lowering this alone adds false moves.
  # To be set from the blind labels.
  move_similarity_threshold: 0.5
  # Pass 3 also compares a removed block with up to this many consecutive added
  # blocks of another document joined together: a moved paragraph is often split
  # (E3 -> E2 severance: 0.40-0.49 per block, 0.76 joined). 1 = no splits.
  split_window: 3
  # Footnote entries (role "footnote", see layer0.footnote_sections) are matched
  # by identical text only: their text is a template ("มาตรา X แก้ไขเพิ่มเติมโดย
  # ... (ฉบับที่ Y)"), so similarity would pair unrelated entries.

identify:
  # Document identification for files without a doc_key (docs/plan.md, M3).
  # All values PROVISIONAL. On the pilot, the right document scored 0.75-0.96
  # text similarity and every other document <= 0.39.
  accept_text_similarity: 0.7   # best candidate at or above this ...
  accept_margin: 0.2            # ... and this far above the second -> accept
  new_document_below: 0.45      # best below this -> new document (to confirm)
  compare_chars: 20000          # characters of normalized text compared
  queue_file: data/labels/doc_identification_queue.csv

layer1:
  # Version of the extraction rules, stored on every REFERENCES edge. A rerun with
  # a new version closes edges of older versions (valid_to) instead of deleting them.
  # L1-v1: first rules. L1-v2: fixes after the dev labels (docs/plan.md).
  # L1-v3: L1-v2 made deterministic (subject targets did not depend on set order).
  rule_version: L1-v3
  # REFERENCES (docs/plan.md, M3). Confidence by how the target was found.
  # All values PROVISIONAL until measured against labels.
  confidence:
    explicit: 1.0          # law name right before/after the section ("มาตรา 6 แห่งพระราชบัญญัติ…")
    link: 1.0              # Markdown link to a known file
    self_document: 0.9     # bare มาตรา/ข้อ inside an act cites the act itself
    same_block_context: 0.85  # bare มาตรา after a law named earlier in the same block
    issued_under: 0.7      # bare มาตรา in a regulation -> the act it is issued under
    name_without_year: 0.8 # law named without พ.ศ. and only one known document fits
    title_mention: 0.7     # English: exact title of another handbook page in text
    subject_name: 0.7      # law named by subject only ("กฎหมายว่าด้วยการคุ้มครองแรงงาน")
  # Extra names for documents, reviewed by a person: {doc_key: [alias, ...]}.
  aliases_file: registry/aliases.yaml

embedding:
  # Chosen 2026-11-25 for the M5 hybrid search (keyword + embedding).
  # Compared with character-trigram TF-IDF (docs/plan.md): handles Thai as well
  # (same-passage hit@1 0.95). Against AI labels it found fewer blocks that need
  # review (recall@5 0.34 vs 0.51), on a small, citation-heavy sample pooled from
  # these two methods: not a general finding. Needs the `embed` dependency group.
  model: intfloat/multilingual-e5-large
  query_prefix: "query: "      # e5 expects these prefixes
  passage_prefix: "passage: "
  device: cpu
  dimensions: 1024             # e5-large; size of the Neo4j vector index on Block

layer2:
  # Entities (M4, src/kg/layer2_entities.py). An entity mentioned in more than
  # this share of the body blocks of its language is a hub (hub = true), kept but
  # not used to generate candidates. null = no hubs.
  # Decided by the user 2026-11-25 from eval/results/m4_registry_coverage_ai.md:
  # 0.2 flags นายจ้าง (0.46) and ลูกจ้าง (0.45) only; 0.15 would add ค่าจ้าง and
  # สวัสดิการ and lose one states pair. With the manual file, "manager" (0.22) is
  # also a hub; the user decided to keep it so (same cut-off for every entity).
  hub_block_share: 0.2
  # Extra entities and aliases reviewed by a person (name, type, language, aliases).
  manual_file: registry/entities_manual.yaml
  # Version of the registry and matching rules, stored on every MENTIONS and
  # ALIAS_OF edge; a rerun with a new version closes older edges (valid_to).
  # L2-v1: registry and MENTIONS. L2-v2: values (number + unit) on MENTIONS.
  rule_version: L2-v2
  # Confidence on MENTIONS from an exact registry match. PROVISIONAL until
  # measured on the blind MENTIONS sheet (data/labels/m4_mentions_sample_human.csv).
  mention_confidence: 0.8
  # LLM fallback (M4 step 4): blocks with at most this many non-hub registry
  # entities go to the LLM. 0 = only blocks with none. Changed only with the user.
  llm_fallback_max_entities: 0

llm:
  # All calls go through src/kg/llm.py. Keys only from environment variables.
  # History: local Ollama model first (2026-11-25, M4 step 4 and M5 check).
  # Back to the local model 2026-11-26 (user), after a short switch to
  # OpenRouter. Nothing leaves this machine. To use OpenRouter instead:
  #   runtime: openrouter, endpoint: https://openrouter.ai/api/v1,
  #   model: deepseek/deepseek-v4.1-flash-1017, api_key_env: OPENROUTER_API_KEY
  #   (key in .env), data_collection: deny, max_tokens: 1024
  runtime: ollama
  endpoint: http://localhost:11434
  model: qwen3.5:4b-q4_K_M    # explicit quantization tag (3.3 GB, 100% GPU)
  num_ctx: 2048          # Ollama only: context size (blocks are short)
  temperature: 0.0       # extraction: deterministic decoding, not the card's chat defaults
  think: false           # thinking mode off for extraction
  max_retries: 2         # invalid JSON: retried this many times, then a recorded failure
  timeout_seconds: 120
  prompt_version: mentions-v1
  prompt_file: prompts/mentions_v1.md
  cache_file: data/cache/llm.sqlite
  confidence: 0.6        # PROVISIONAL, below registry matches (0.8)
  # Impact check (M5 step 13, decided 2026-11-26: local model, top 10 per change)
  check_prompt_version: impact-check-v1
  check_prompt_file: prompts/impact_check_v1.md
  check_num_ctx: 4096    # old + new + candidate passage
  # Layer 3 (entity merge) and layer 4 (DEPENDS) prompts
  merge_prompt_version: merge-v1
  merge_prompt_file: prompts/merge_v1.md
  depends_prompt_version: depends-v1
  depends_prompt_file: prompts/depends_v1.md
  depends_num_ctx: 4096

impact:
  # M5 ranking of candidate blocks (src/kg/impact.py). Decided by the user
  # 2026-11-26 from eval/results/m5_impact_ai.md (AI labels): graph_first
  # recall@5 0.66 vs rrf 0.54 vs hybrid alone 0.28. rrf is kept for comparison.
  ranking: graph_first
  top_n: 20             # candidates reported per change (step 13 will cut this list)
  report_dir: data/reports   # not in git: reports quote document text
  check_top_n: 10       # candidates per change the LLM checks (user decision 2026-11-26)
  review_dir: data/labels/reviews   # review sheets + history (step 14), backed up with labels
  review_reject_factor: 0.5   # PROVISIONAL: confidence x this on edges behind a rejected item

layer3:
  # Entity merge (M6, src/kg/layer3_merge.py). All values PROVISIONAL.
  rule_version: L3-v1
  min_similarity: 0.85       # e5 cosine of the two names to become a candidate pair
  top_k: 3                   # nearest names per entity sent to the LLM
  min_containment_chars: 4   # a name inside another counts from this length (compact)
  confidence: 0.6            # on ALIAS_OF edges written by the merge

layer4:
  # DEPENDS (M7, src/kg/layer4_depends.py). All values PROVISIONAL.
  rule_version: L4-v1
  nearest_k: 5               # nearest blocks by e5 added to the shared-entity pairs
  max_pairs_per_block: 5     # cap per block
  central_share: 0.2         # most central blocks processed: 0.2 = variant B, 1.0 = C
  confidence: 0.6            # on DEPENDS edges (LLM, evidence quoted from both blocks)
